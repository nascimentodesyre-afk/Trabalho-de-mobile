<ion-content [fullscreen]="true"><div class="login-shell"><div class="brand"><div class="brand-mark"><ion-icon name="cube-outline"></ion-icon></div><h1>IPE</h1><p>Sistema de Inventário e Patrimônio Escolar</p></div><ion-card><ion-card-header><ion-card-title>Acessar sua conta</ion-card-title><ion-card-subtitle>Entre para continuar</ion-card-subtitle></ion-card-header><ion-card-content><ion-item><ion-input label="E-mail" labelPlacement="stacked" type="email" [(ngModel)]="email"></ion-input></ion-item><ion-item><ion-input label="Senha" labelPlacement="stacked" [type]="mostrarSenha?'text':'password'" [(ngModel)]="senha"></ion-input><ion-button fill="clear" slot="end" (click)="mostrarSenha=!mostrarSenha"><ion-icon [name]="mostrarSenha?'eye-off-outline':'eye-outline'"></ion-icon></ion-button></ion-item><ion-item lines="none"><ion-checkbox [(ngModel)]="adminCheck" labelPlacement="end">Acesso de patrimônio</ion-checkbox></ion-item><ion-item *ngIf="adminCheck"><ion-input label="Chave de acesso" labelPlacement="stacked" type="password" [(ngModel)]="chave"></ion-input></ion-item><ion-text color="danger" *ngIf="erro"><p>{{erro}}</p></ion-text><ion-button expand="block" class="enter" (click)="entrar()" [disabled]="carregando"><ion-spinner *ngIf="carregando" name="crescent"></ion-spinner><span *ngIf="!carregando">Entrar</span></ion-button></ion-card-content></ion-card><p class="footnote">IPE · Gestão de patrimônio escolar</p></div></ion-content>
