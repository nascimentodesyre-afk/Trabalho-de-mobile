<ion-header><ion-toolbar><ion-buttons slot="start"><ion-back-button defaultHref="/home"></ion-back-button></ion-buttons><ion-title>Chamados</ion-title></ion-toolbar></ion-header><ion-content><div class="page-wrap"><div class="empty-state" *ngIf="carregando"><ion-spinner></ion-spinner><p>Carregando chamados...</p></div><ion-text color="danger" *ngIf="erro"><p>{{erro}}</p></ion-text><ion-card *ngFor="let c of chamados"><ion-card-header><div class="ticket-head"><ion-card-title>Chamado #{{c.id_chamado}}</ion-card-title><ion-badge [color]="c.nome_status==='Concluído'?'success':c.nome_status==='Cancelado'?'medium':'warning'">{{c.nome_status}}</ion-badge></div><ion-card-subtitle>{{c.data_abertura}} · {{c.nome_patrimonio}}</ion-card-subtitle></ion-card-header><ion-card-content><p>{{c.descricao_problema}}</p><ion-chip color="medium">{{c.prioridade||'Sem prioridade'}}</ion-chip></ion-card-content></ion-card><div class="empty-state" *ngIf="!carregando&&!erro&&chamados.length===0">Você ainda não possui chamados.</div></div></ion-content>
